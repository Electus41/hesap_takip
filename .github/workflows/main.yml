name: Hesap Takip CI/CD (Web, APK, iOS)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-web-and-apk:
    name: Web Yayını ve APK Oluşturma
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri İndir
        run: flutter pub get

      - name: Uygulama İkonlarını Oluştur
        run: dart run flutter_launcher_icons

      - name: Web İçin Derle
        run: flutter build web --release --base-href "/hesap_takip/"

      - name: Web Sürümünü GitHub Pages'e Yükle
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: Android APK Derle
        run: flutter build apk --release

      - name: APK Dosyasını Kaydet (Artifact Olarak)
        uses: actions/upload-artifact@v4
        with:
          name: HesapTakip-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS Derlemesi ve IPA Üretimi
    runs-on: macos-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Paketleri İndir
        run: flutter pub get

      - name: iOS İkonlarını Oluştur
        run: dart run flutter_launcher_icons

      - name: iOS İçin Derle (Sertifikasız)
        run: flutter build ios --release --no-codesign

      - name: IPA Dosyasını Paketle
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r HesapTakip.ipa Payload
          cd ../../..

      - name: IPA Dosyasını Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: HesapTakip-IPA
          path: build/ios/iphoneos/HesapTakip.ipa